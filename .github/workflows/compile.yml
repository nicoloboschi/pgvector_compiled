name: Compile pgvector

on:
  push:
    paths:
      - ".github/workflows/compile.yml"
      - "build-config.json"
  workflow_dispatch:

env:
  PGVECTOR_REPO: "pgvector/pgvector"

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check_release.outputs.new_version }}
      version: ${{ steps.check_release.outputs.version }}
      pg_version: ${{ steps.read_config.outputs.pg_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build config
        id: read_config
        run: |
          pg_version=$(jq -r '.postgresql_version' build-config.json)
          echo "pg_version=$pg_version" >> $GITHUB_OUTPUT
          echo "PostgreSQL version: $pg_version"

      - name: Check for new release
        id: check_release
        run: |
          latest_tag=$(curl -s "https://api.github.com/repos/${{ env.PGVECTOR_REPO }}/tags" | jq -r '.[0].name')
          echo "Latest tag: ${latest_tag#v}"
          latest_version=${latest_tag#v}
          echo "version=$latest_version" >> $GITHUB_OUTPUT

          # Get the current version from the latest release of this repo
          release_response=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          if echo "$release_response" | jq -e '.message == "Not Found"' > /dev/null 2>&1; then
            echo "No existing release found"
            current_version=""
          else
            current_version=$(echo "$release_response" | jq -r '.body // ""' | grep -oE 'pgvector v[0-9.]+' | sed 's/pgvector v//' || echo "")
          fi
          echo "Current version: $current_version"

          if [[ "$latest_version" != "$current_version" ]]; then
            echo "new_version=true" >> $GITHUB_OUTPUT
          else
            echo "new_version=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_version
    if: needs.check_version.outputs.new_version == 'true' || github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    env:
      PG_VERSION: ${{ needs.check_version.outputs.pg_version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc

    steps:
      - name: Build pgvector against the GLIBC 2.35 baseline (Linux)
        if: runner.os == 'Linux'
        run: |
          # Do not copy the host distribution's pgvector package: its ABI can
          # require a newer GLIBC than the pg0 GNU binary supports. Building
          # from source in Jammy keeps the extension at the GLIBC 2.35 floor.
          docker run --rm -v "$PWD:/output" -e PG_VERSION -e PGVECTOR_VERSION -e PGVECTOR_REPO -e TRIPLE ubuntu:22.04 sh -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl gnupg git make gcc clang llvm
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
              gpg --dearmor --batch --yes -o /usr/share/keyrings/postgresql.gpg
            echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt jammy-pgdg main" \
              > /etc/apt/sources.list.d/pgdg.list
            apt-get update
            apt-get install -y postgresql-${PG_VERSION} postgresql-server-dev-${PG_VERSION}

            git clone --branch v${PGVECTOR_VERSION} --depth 1 https://github.com/${PGVECTOR_REPO}.git /tmp/pgvector
            cd /tmp/pgvector
            export PG_CONFIG=/usr/lib/postgresql/${PG_VERSION}/bin/pg_config
            make OPTFLAGS=""
            make install

            PKGLIBDIR=$($PG_CONFIG --pkglibdir)
            SHAREDIR=$($PG_CONFIG --sharedir)
            INCLUDEDIR_SERVER=$($PG_CONFIG --includedir-server)
            ARTIFACT=/output/pgvector-${TRIPLE}-pg${PG_VERSION}
            mkdir -p "$ARTIFACT/lib/bitcode/vector/src" "$ARTIFACT/share/extension" "$ARTIFACT/include/server/extension/vector"
            cp "$PKGLIBDIR/vector.so" "$ARTIFACT/lib/"
            cp "$SHAREDIR/extension/vector"*.sql "$SHAREDIR/extension/vector.control" "$ARTIFACT/share/extension/"
            cp "$INCLUDEDIR_SERVER/extension/vector"/*.h "$ARTIFACT/include/server/extension/vector/"
            if [ -d "$PKGLIBDIR/bitcode/vector" ]; then
              cp "$PKGLIBDIR/bitcode/vector.index.bc" "$ARTIFACT/lib/bitcode/" || true
              cp "$PKGLIBDIR/bitcode/vector/src/"*.bc "$ARTIFACT/lib/bitcode/vector/src/" || true
            fi

            max_glibc=$(objdump -T "$PKGLIBDIR/vector.so" | sed -n "s/.*GLIBC_\\([0-9.]*\\).*/\\1/p" | sort -V | tail -1)
            if [ -n "$max_glibc" ] && [ "$(printf "%s\\n" "$max_glibc" 2.35 | sort -V | tail -1)" != "2.35" ]; then
              echo "vector.so requires GLIBC_${max_glibc}; expected GLIBC_2.35 or older" >&2
              exit 1
            fi
          '
        env:
          PGVECTOR_VERSION: ${{ needs.check_version.outputs.version }}
          TRIPLE: ${{ matrix.triple }}

      - name: Set up PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@${{ env.PG_VERSION }}
          echo "/usr/local/opt/postgresql@${{ env.PG_VERSION }}/bin" >> $GITHUB_PATH

      - name: Set up PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          choco install postgresql${{ env.PG_VERSION }} --params '/Password:postgres'
          echo "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}\bin" >> $GITHUB_PATH
          echo "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}" >> $GITHUB_PATH

      - name: Clone pgvector (macOS and Windows)
        if: runner.os != 'Linux'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PGVECTOR_REPO }}
          ref: v${{ needs.check_version.outputs.version }}

      - name: Compile pgvector (macOS)
        if: runner.os == 'macOS'
        run: |
          export PG_CONFIG="$(brew --prefix postgresql@${{ env.PG_VERSION }})/bin/pg_config"
          make
          sudo --preserve-env=PG_CONFIG make install

      - name: Set up Visual Studio and compile pgvector (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "PGROOT=C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}"
          nmake /F Makefile.win
          nmake /F Makefile.win install

      - name: Create artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          zip -r pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.zip pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}
          tar -czvf pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar.gz pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}

      - name: Create artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use pg_config to get correct paths (works across different PG versions)
          export PG_CONFIG="$(brew --prefix postgresql@${{ env.PG_VERSION }})/bin/pg_config"
          PKGLIBDIR=$($PG_CONFIG --pkglibdir)
          SHAREDIR=$($PG_CONFIG --sharedir)
          INCLUDEDIR_SERVER=$($PG_CONFIG --includedir-server)

          echo "PKGLIBDIR: $PKGLIBDIR"
          echo "SHAREDIR: $SHAREDIR"
          echo "INCLUDEDIR_SERVER: $INCLUDEDIR_SERVER"

          # Create directory structure
          mkdir -p pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib
          mkdir -p pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/share/extension
          mkdir -p pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/include/server/extension/vector

          # Copy shared library
          cp $PKGLIBDIR/vector.dylib pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib/

          # Copy extension files
          cp $SHAREDIR/extension/vector*.sql pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/share/extension/
          cp $SHAREDIR/extension/vector.control pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/share/extension/

          # Copy header files
          cp $INCLUDEDIR_SERVER/extension/vector/*.h pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/include/server/extension/vector/

          # Create a .so symlink for compatibility
          cp $PKGLIBDIR/vector.dylib pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib/vector.so

          # Create zip archive
          zip -r pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.zip pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}

          # Create tar.gz archive
          tar -czvf pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar.gz pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          REM Create directory structure
          mkdir pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\lib
          mkdir pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\share\extension
          mkdir pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\include\server\extension\vector

          REM Copy shared library
          copy "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}\lib\vector.dll" pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\lib\

          REM Copy extension files
          copy "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}\share\extension\vector*.sql" pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\share\extension\
          copy "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}\share\extension\vector.control" pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\share\extension\

          REM Copy header files
          copy "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}\include\server\extension\vector\halfvec.h" pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\include\server\extension\vector\
          copy "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}\include\server\extension\vector\sparsevec.h" pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\include\server\extension\vector\
          copy "C:\Program Files\PostgreSQL\${{ env.PG_VERSION }}\include\server\extension\vector\vector.h" pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}\include\server\extension\vector\

          REM Create zip archive
          7z a -tzip pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.zip pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}

          REM Create tar.gz archive
          7z a -ttar pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}
          7z a -tgzip pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar.gz pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar
          del pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}
          path: |
            pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.zip
            pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar.gz

  build-musl:
    needs: check_version
    if: needs.check_version.outputs.new_version == 'true' || github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    env:
      PG_VERSION: ${{ needs.check_version.outputs.pg_version }}
      PGVECTOR_VERSION: ${{ needs.check_version.outputs.version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-musl
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
            platform: linux/arm64

    steps:
      - name: Build pgvector in Alpine container
        run: |
          docker run --rm -v $PWD:/output --platform ${{ matrix.platform }} alpine:edge sh -c '
            set -e
            apk add --no-cache postgresql${{ env.PG_VERSION }}-dev git make gcc musl-dev clang llvm

            # Clone pgvector
            git clone --branch v${{ env.PGVECTOR_VERSION }} --depth 1 https://github.com/pgvector/pgvector.git
            cd pgvector

            # Compile
            make
            make install

            # Get paths from pg_config
            PKGLIBDIR=$(pg_config --pkglibdir)
            SHAREDIR=$(pg_config --sharedir)
            INCLUDEDIR_SERVER=$(pg_config --includedir-server)

            echo "PKGLIBDIR: $PKGLIBDIR"
            echo "SHAREDIR: $SHAREDIR"
            echo "INCLUDEDIR_SERVER: $INCLUDEDIR_SERVER"

            # Create artifact directory
            cd /output
            mkdir -p pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib
            mkdir -p pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/share/extension
            mkdir -p pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/include/server/extension/vector

            # Copy shared library
            cp $PKGLIBDIR/vector.so pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib/

            # Copy bitcode if available
            if [ -d "$PKGLIBDIR/bitcode/vector" ]; then
              mkdir -p pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib/bitcode/vector/src
              cp $PKGLIBDIR/bitcode/vector.index.bc pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib/bitcode/ || true
              cp $PKGLIBDIR/bitcode/vector/src/*.bc pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/lib/bitcode/vector/src/ || true
            fi

            # Copy extension files
            cp $SHAREDIR/extension/vector*.sql pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/share/extension/
            cp $SHAREDIR/extension/vector.control pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/share/extension/

            # Copy header files
            cp $INCLUDEDIR_SERVER/extension/vector/*.h pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}/include/server/extension/vector/
          '

      - name: Create archives
        run: |
          zip -r pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.zip pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}
          tar -czvf pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar.gz pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}
          path: |
            pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.zip
            pgvector-${{ matrix.triple }}-pg${{ env.PG_VERSION }}.tar.gz

  release:
    needs: [check_version, build, build-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PG_VERSION: ${{ needs.check_version.outputs.pg_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh auth status
          # Debug: check token permissions
          curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/${{ github.repository }} | jq '.permissions'
          gh release create "v0.${{ env.PG_VERSION }}.${{ github.run_number }}" \
            --title "v0.${{ env.PG_VERSION }}.${{ github.run_number }}" \
            --notes "pgvector v${{ needs.check_version.outputs.version }} for PostgreSQL ${{ env.PG_VERSION }}" \
            artifacts/**/*
